<!DOCTYPE html>
<html>
<head>

    <title>Mock Test Settings</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f3f8;
            color: #333;
        }

        /* NAVBAR */

        .navbar {
            background: linear-gradient(135deg, #d81b60, #8e24aa);
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            color: #8e24aa;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #777;
        }

        /* CARD */

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 20px;
            color: #8e24aa;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        /* FORM */

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #8e24aa;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* CHECKBOX */

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .cancel-btn {
            background: #eee;
            color: #555;
        }

        .next-btn {
            background: linear-gradient(135deg, #d81b60, #8e24aa);
            color: white;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .container {
                width: 95%;
            }

            .card {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .buttons {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        Skill Swap - Tutor Panel
    </div>

    <div class="nav-links">

        <a href="{% url 'tutor_dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="container">

    <div class="page-header">

        <h1>📝 Create Mock Test</h1>

        <p>
            Configure your mock test settings before adding questions.
        </p>

    </div>


    <div class="card">

        <form method="post">

            {% csrf_token %}


            <!-- BASIC INFORMATION -->

            <div class="section-title">
                Test Information
            </div>


            <div class="form-group">

                <label for="title">
                    Test Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter test title"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="skill">
                        Skill
                    </label>

                    <select id="skill" name="skill">

                        <option value="">
                            Select Skill
                        </option>

                        {% for skill in skills %}

                            <option value="{{ skill.id }}">
                                {{ skill.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="difficulty">
                        Difficulty
                    </label>

                    <select
                        id="difficulty"
                        name="difficulty"
                        required
                    >

                        <option value="easy">
                            Easy
                        </option>

                        <option value="medium" selected>
                            Medium
                        </option>

                        <option value="hard">
                            Hard
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter a short description about this test..."
                ></textarea>

            </div>


            <!-- TEST SETTINGS -->

            <div class="section-title">
                Test Settings
            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="total_questions">
                        Number of Questions
                    </label>

                    <input
                        type="number"
                        id="total_questions"
                        name="total_questions"
                        value="10"
                        min="1"
                        required
                    >

                    <div class="help-text">
                        Number of questions students must answer.
                    </div>

                </div>


                <div class="form-group">

                    <label for="duration_minutes">
                        Duration (Minutes)
                    </label>

                    <input
                        type="number"
                        id="duration_minutes"
                        name="duration_minutes"
                        value="30"
                        min="1"
                        required
                    >

                    <div class="help-text">
                        Time allowed to complete the test.
                    </div>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="marks_per_question">
                        Marks Per Question
                    </label>

                    <input
                        type="number"
                        id="marks_per_question"
                        name="marks_per_question"
                        value="1"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="passing_score">
                        Passing Score (%)
                    </label>

                    <input
                        type="number"
                        id="passing_score"
                        name="passing_score"
                        value="70"
                        min="1"
                        max="100"
                        required
                    >

                </div>

            </div>


            <!-- RESULT SETTINGS -->

            <div class="section-title">
                Result Settings
            </div>


            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="show_result_immediately"
                    name="show_result_immediately"
                    checked
                >

                <label for="show_result_immediately">

                    Show result immediately after test

                </label>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <a
                    href="{% url 'tutor_dashboard' %}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="btn next-btn"
                >
                    Save & Add Questions →
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
